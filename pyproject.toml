[project]
name = "seu-lecture-cli"
version = "0.1.0"
description = "Unofficial low-latency CLI for SEU undergraduate humanities lecture reservations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "wynter-yaxley" }]
keywords = ["seu", "southeast-university", "lecture", "cli", "agent"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cryptography>=42",
    "ddddocr>=1.5.6",
    "httpx>=0.27,<1",
    "keyring>=25",
    "rich>=13",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/wynter-yaxley/seu-lecture-cli"

[project.scripts]
seu-lecture = "seu_lecture.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seu_lecture"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
